version: "3.9"

services:
  dood-serve:
    build: .
    container_name: dood-serve
    restart: unless-stopped
    ports:
      - "1111:8080"
    environment:
      - PORT=8080
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-changeme}
      - CADDY_CONTAINER_NAME=${CADDY_CONTAINER_NAME:-caddy}
      - DOOD_NETWORK=${DOOD_NETWORK:-dood-net}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./ssh:/root/.ssh
